name: Bot CIMAC 24/7
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 PyPDF2 python-docx openpyxl
      - run: python bot.py
        env:
          CIMAC_USER: ${{ secrets.CIMAC_USER }}
          CIMAC_PASS: ${{ secrets.CIMAC_PASS }}
          GREEN_TOKEN: ${{ secrets.GREEN_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
